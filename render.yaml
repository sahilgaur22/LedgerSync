databases:
  - name: ledgersync-db
    plan: free
    databaseName: ledgersync
    user: ledgersync
    postgresMajorVersion: "16"

services:
  - type: web
    name: ledgersync-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: alembic -c backend/alembic.ini upgrade head && python -c "from backend.app.seed.run_seed import seed_database; seed_database()" && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: ledgersync-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
